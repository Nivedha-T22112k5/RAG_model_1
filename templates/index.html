<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LangChain + ChromaDB RAG Engine</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; background-color: #f9f9f9; color: #333; }
        h1 { text-align: center; color: #2c3e50; }
        .card { background: #ffffff; border: 1px solid #e0e0e0; padding: 24px; border-radius: 10px; margin-bottom: 24px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        h2 { margin-top: 0; font-size: 1.25rem; color: #34495e; }
        .form-group { display: flex; gap: 10px; margin-top: 15px; }
        input[type="file"], input[type="text"] { flex-grow: 1; padding: 10px 14px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
        button { padding: 10px 20px; background-color: #0066cc; color: #ffffff; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; }
        button:hover { background-color: #0052a3; }
        #chat-history { height: 320px; overflow-y: auto; border: 1px solid #e2e8f0; border-radius: 6px; padding: 15px; background: #fafafa; margin-bottom: 15px; }
        .user-msg { color: #0066cc; font-weight: 600; margin: 10px 0 4px 0; }
        .bot-msg { color: #2d3748; background: #edf2f7; padding: 10px 14px; border-radius: 6px; margin-bottom: 12px; line-height: 1.5; }
        .status-msg { margin-top: 10px; font-size: 14px; font-weight: 500; }
        .status-success { color: #27ae60; }
        .status-error { color: #c0392b; }
    </style>
</head>
<body>

    <h1>LangChain & ChromaDB RAG Assistant</h1>

    <!-- File Upload Section -->
    <div class="card">
        <h2>1. Upload Knowledge Document (PDF / TXT)</h2>
        <form id="uploadForm" class="form-group">
            <input type="file" id="fileInput" accept=".pdf,.txt" required>
            <button type="submit" id="uploadBtn">Upload & Index</button>
        </form>
        <div id="uploadStatus" class="status-msg"></div>
    </div>

    <!-- Chat / Query Section -->
    <div class="card">
        <h2>2. Chat with Documents</h2>
        <div id="chat-history"></div>
        <form id="queryForm" class="form-group">
            <input type="text" id="queryInput" placeholder="Ask a question about your uploaded file..." required>
            <button type="submit" id="sendBtn">Send</button>
        </form>
    </div>

    <script>
        // Upload Handler
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const fileInput = document.getElementById('fileInput');
            const status = document.getElementById('uploadStatus');
            const uploadBtn = document.getElementById('uploadBtn');

            if (!fileInput.files[0]) return;

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            status.className = 'status-msg';
            status.innerText = "Processing & vectorizing document...";
            uploadBtn.disabled = true;

            try {
                const res = await fetch('/upload', { method: 'POST', body: formData });
                const data = await res.json();
                
                if (res.ok) {
                    status.className = 'status-msg status-success';
                    status.innerText = data.message;
                    fileInput.value = '';
                } else {
                    status.className = 'status-msg status-error';
                    status.innerText = data.error || 'Failed to upload document.';
                }
            } catch (err) {
                status.className = 'status-msg status-error';
                status.innerText = "Error uploading document.";
            } finally {
                uploadBtn.disabled = false;
            }
        });

        // Chat Handler
        document.getElementById('queryForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const queryInput = document.getElementById('queryInput');
            const query = queryInput.value.trim();
            if (!query) return;

            queryInput.value = '';
            const chatHistory = document.getElementById('chat-history');
            chatHistory.innerHTML += `<div class="user-msg">You: ${escapeHtml(query)}</div>`;
            chatHistory.scrollTop = chatHistory.scrollHeight;

            const sendBtn = document.getElementById('sendBtn');
            sendBtn.disabled = true;

            try {
                const res = await fetch('/query', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query })
                });
                const data = await res.json();
                
                if (res.ok) {
                    chatHistory.innerHTML += `<div class="bot-msg"><b>Bot:</b> ${escapeHtml(data.answer)}</div>`;
                } else {
                    chatHistory.innerHTML += `<div class="bot-msg status-error"><b>Error:</b> ${escapeHtml(data.error || 'Query failed.')}</div>`;
                }
            } catch (err) {
                chatHistory.innerHTML += `<div class="bot-msg status-error"><b>Error:</b> Failed to reach server.</div>`;
            } finally {
                sendBtn.disabled = false;
                chatHistory.scrollTop = chatHistory.scrollHeight;
            }
        });

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
